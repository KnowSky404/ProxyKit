name: Build and check rules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install verified official sing-box 1.14.4
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sing-box-1.14.4-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz \
            --output "$archive"
          echo "699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-1.14.4-linux-amd64" >> "$GITHUB_PATH"
          echo "SING_BOX_BIN=$RUNNER_TEMP/sing-box-1.14.4-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Verify types, matching, runtime routing, quality and committed artifacts
        run: bun run rules:verify
      - name: Build all clients in staging
        shell: bash
        run: |
          set -euo pipefail
          bun tools/rulegen/src/cli.ts build --output "$RUNNER_TEMP/proxykit-rules"
          bun tools/rulegen/src/cli.ts check --output "$RUNNER_TEMP/proxykit-rules"
      - name: Confirm checks left the worktree unchanged
        run: git diff --exit-code
