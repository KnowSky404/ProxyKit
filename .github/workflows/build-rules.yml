name: Build and check rules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install verified official sing-box 1.10.7
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sing-box-1.10.7-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/SagerNet/sing-box/releases/download/v1.10.7/sing-box-1.10.7-linux-amd64.tar.gz \
            --output "$archive"
          echo "1951a0785c8b4e1e21e0640227a49528ca772aec3d680061652e3d6b687e00fe  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-1.10.7-linux-amd64" >> "$GITHUB_PATH"
          echo "SING_BOX_BIN=$RUNNER_TEMP/sing-box-1.10.7-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Type check
        run: bun run typecheck
      - name: Run generator, SRS integration and existing plugin tests
        run: bun test
      - name: Validate all YAML and target semantics
        run: bun run rules:validate
      - name: Build all clients in staging
        shell: bash
        run: |
          set -euo pipefail
          bun tools/rulegen/src/cli.ts build --output "$RUNNER_TEMP/proxykit-rules"
          bun tools/rulegen/src/cli.ts check --output "$RUNNER_TEMP/proxykit-rules"
      - name: Check committed generated artifacts
        run: bun run rules:check
      - name: Confirm checks left the worktree unchanged
        run: git diff --exit-code
