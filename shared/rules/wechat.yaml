# Canonical source; regenerate client files with bun run rules:build.
version: 1
metadata:
  name: "WeChat"
  author: "KnowSky404"
  updated: "2026-11-06"
  source: "Original: https://microbin.knowsky.uk/raw/bqWQ3e; blackmatrix7 WeChat: https://github.com/blackmatrix7/ios_rule_script/blob/0fa60782abfe70f58da510e90d9086136cf0d855/rule/Loon/WeChat/WeChat.list"
  note: "All clients retain the original 31 domain/IP predicates. Loon additionally uses two User-Agent patterns and AS132203 from blackmatrix7; QX/sing-box retain the original scope. Private-IP routing and policy remain in consumer configuration."
compatibility:
  quantumultx_no_resolve: legacy-policy-token
  sing_box_no_resolve: require-no-pre-resolution
groups:
  - name: "Original IP range"
    comments:
      - "The full supplied range is retained; it is not exclusive to WeChat."
      - "Migration uses the repository's no-pre-resolution contract; the original route rule did not encode no-resolve."
      - "QX's third-field no-resolve is a compatibility policy token, not a DNS switch; set filter_remote force-policy."
    rules:
      - type: ipv4-cidr
        value: "43.160.0.0/12"
        options:
          no_resolve: true
  - name: "Original exact domains"
    comments:
      - "Shared service endpoints are retained exactly as supplied, without expanding them to suffixes."
    rules:
      - type: domain
        value: "apd-pcdnwxlogin.teg.tencent-cloud.net"
      - type: domain
        value: "btrace.qq.com"
      - type: domain
        value: "dldir1.qq.com"
      - type: domain
        value: "slife.xy-asia.com"
      - type: domain
        value: "soup.v.qq.com"
      - type: domain
        value: "vweixinf.tc.qq.com"
      - type: domain
        value: "weixin110.qq.com"
      - type: domain
        value: "wup.imtt.qq.com"
  - name: "Original domain suffixes"
    rules:
      - type: domain-suffix
        value: "iot-tencent.com"
      - type: domain-suffix
        value: "lbs.gtimg.com"
      - type: domain-suffix
        value: "map.qq.com"
      - type: domain-suffix
        value: "qlogo.cn"
      - type: domain-suffix
        value: "qpic.cn"
      - type: domain-suffix
        value: "servicewechat.com"
      - type: domain-suffix
        value: "tenpay.com"
      - type: domain-suffix
        value: "up-hl.3g.qq.com"
      - type: domain-suffix
        value: "vweixinthumb.tc.qq.com"
      - type: domain-suffix
        value: "wechat.com"
      - type: domain-suffix
        value: "wechatlegal.net"
      - type: domain-suffix
        value: "wechatos.net"
      - type: domain-suffix
        value: "wechatpay.com"
      - type: domain-suffix
        value: "weixin.com"
      - type: domain-suffix
        value: "weixin.qq.com"
      - type: domain-suffix
        value: "weixinbridge.com"
      - type: domain-suffix
        value: "weixinsxy.com"
      - type: domain-suffix
        value: "wx.gtimg.com"
      - type: domain-suffix
        value: "wx.qq.com"
      - type: domain-suffix
        value: "wxapp.tc.qq.com"
      - type: domain-suffix
        value: "wxs.qq.com"
      - type: domain-suffix
        value: "yun-hl.3g.qq.com"
  - name: "Loon additions from blackmatrix7"
    comments:
      - "Checked 2026-11-06: all 8 exact domains and 22 suffixes already match upstream, in order."
      - "Upstream author: blackmatrix7; license: GPL-2.0, https://github.com/blackmatrix7/ios_rule_script/blob/0fa60782abfe70f58da510e90d9086136cf0d855/LICENSE"
      - "These additions are intentionally Loon-only; QX retains the original scope by request, not because it lacks these rule types."
      - "sing-box Source Rule Set v2 has no User-Agent or ASN predicates; no dynamic ASN-to-CIDR expansion is performed."
      - "User-Agent matches visible HTTP request headers, not all traffic from the app."
      - "AS132203 is a shared Tencent network, not WeChat-exclusive; it is not equivalent to 43.160.0.0/12."
    rules:
      - type: user-agent
        value: "MicroMessenger*"
        targets: [loon]
      - type: user-agent
        value: "WeChat*"
        targets: [loon]
      - type: ip-asn
        value: "132203"
        targets: [loon]
        options:
          no_resolve: true
